name: Decompile Chromeware Reference

on:
  push:
    paths:
      - .github/workflows/decompile-chromeware.yml

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CFR
        run: curl -L --fail -o cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar

      - name: Decompile Chromeware
        run: |
          mkdir -p decompiled
          java -jar cfr.jar chromeware-1.1.1.jar --outputdir decompiled --silent true

      - name: Commit decompiled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decompiled
          git commit -m "Reference: decompile Chromeware 1.1.1" || exit 0
          git push
